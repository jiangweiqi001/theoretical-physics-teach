name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Theoretical-physics-only identity contract
        shell: pwsh
        run: ./tests/rebrand-contract.ps1 -Section All
      - name: Static skill contract
        shell: pwsh
        run: ./tests/static-contract.ps1
      - name: Bootstrap template contract
        shell: pwsh
        run: ./tests/bootstrap-contract.ps1
      - name: Behavioral scenario isolation
        shell: pwsh
        run: ./tests/scenario-contract.ps1
      - name: Accepted behavioral output contract
        shell: pwsh
        run: ./tests/green-contract.ps1
      - name: Normative workspace example contract
        shell: pwsh
        run: ./tests/example-contract.ps1
      - name: Python unit tests
        shell: pwsh
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Public documentation links
        shell: pwsh
        run: python -X utf8 scripts/check_markdown_links.py README.md README.zh-CN.md CHANGELOG.md docs/architecture.md docs/walkthrough.md
      - name: Runtime package build
        shell: pwsh
        run: python -X utf8 scripts/build_skill_package.py --output dist/theoretical-physics-teach-v0.4.0.zip
      - name: Whitespace check
        shell: pwsh
        run: git diff --check
